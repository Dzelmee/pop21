name: Importar foto de aniversários
on:
  push:
    paths:
      - '.github/workflows/importar-foto-aniversarios.yml'
permissions:
  contents: write
jobs:
  importar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Baixar fotografia original
        run: |
          python -m pip install --quiet gdown
          mkdir -p public/media
          gdown --id 18KNxKZJzm7Qeh6p7ASUoTnAY3tsjBze6 -O public/media/aniversarios.jpg
          python - <<'PY'
          from pathlib import Path
          p=Path('public/media/aniversarios.jpg')
          assert p.read_bytes()[:3]==bytes.fromhex('ffd8ff'), 'Arquivo recebido não é JPEG'
          print('Fotografia validada:',p.stat().st_size,'bytes')
          PY
      - name: Salvar fotografia no repositório
        run: |
          git config user.name "POP21"
          git config user.email "actions@users.noreply.github.com"
          git add public/media/aniversarios.jpg
          git commit -m "fix: adiciona fotografia de aniversários ao site"
          git push
